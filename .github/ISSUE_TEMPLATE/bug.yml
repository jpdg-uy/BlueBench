name: Bug report
description: Something does not work as expected
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The more of this you fill in, the faster it can be fixed.
        Tip: `BlueBench.exe --self-test` writes `bluebench-selftest.txt` next to the exe.
  - type: input
    id: version
    attributes:
      label: BlueBench version
      description: Shown in the window title, e.g. 0.2.0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Scanner
        - Connection / GATT
        - UART terminal
        - Pairing / bonding
        - Macros
        - DFU
        - Traffic tab (app traffic)
        - Traffic tab (nRF Sniffer)
        - Installation / startup
        - Other
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Bluetooth adapter and target device
      description: PC adapter (built-in / USB dongle model), the device you were talking to, and sniffer hardware if relevant
      placeholder: Intel AX211 built-in; nRF52840 DK running peripheral_uart
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect to ...
        2. Write 01 02 to ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Log panel → Export… and attach the file, or paste the relevant lines. For sniffer issues, attach the exported .pcap too.
      render: text
  - type: textarea
    id: selftest
    attributes:
      label: Self-test output (optional)
      description: Contents of bluebench-selftest.txt
      render: json
